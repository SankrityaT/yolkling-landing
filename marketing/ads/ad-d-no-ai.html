<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Yolkling ad — written, not drawn</title>
<meta name="hz:slide-selector" content=".ad-square" />
<meta name="hz:canvas-width" content="1080" />
<meta name="hz:canvas-height" content="1080" />
<style>
  @import url('https://fonts.googleapis.com/css2?family=Onest:wght@700;800;900&family=DM+Sans:wght@400;500;700&family=DM+Mono:wght@400;500&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { display: flex; justify-content: center; align-items: center; min-height: 100vh; background: #e9e2d3; }

  .ad-square {
    position: relative;
    width: 1080px;
    height: 1080px;
    overflow: hidden;
    background: linear-gradient(160deg, #241E33 0%, #171225 60%, #0F0C1A 100%);
    font-family: 'DM Sans', sans-serif;
  }

  .bg-photo {
    position: absolute;
    inset: 0;
    background-image: url('./bg-no-ai.jpg');
    background-size: cover;
    background-position: center;
    opacity: .5;
    mix-blend-mode: luminosity;
  }

  .bg-scrim {
    position: absolute;
    inset: 0;
    background: linear-gradient(180deg, rgba(15,12,26,.2) 0%, rgba(15,12,26,.35) 45%, rgba(15,12,26,.85) 100%);
  }

  .brand-pill {
    position: absolute;
    top: 48px;
    left: 48px;
    display: flex;
    align-items: center;
    gap: 10px;
    background: rgba(251,246,236,.94);
    padding: 10px 22px 10px 12px;
    border-radius: 999px;
    box-shadow: 0 4px 16px rgba(0,0,0,.3);
  }
  .brand-pill svg { width: 34px; height: 34px; display: block; }
  .brand-pill span {
    font-family: 'Onest', sans-serif;
    font-weight: 800;
    font-size: 22px;
    letter-spacing: -.01em;
    color: #2A241B;
  }

  .code-panel {
    position: absolute;
    top: 168px;
    left: 48px;
    width: 620px;
    background: rgba(0,0,0,.38);
    border: 1px solid rgba(255,255,255,.12);
    border-radius: 18px;
    padding: 26px 28px;
    font-family: 'DM Mono', monospace;
    font-size: 20px;
    line-height: 1.65;
    color: #B9AEDB;
  }
  .code-panel .kw { color: #7B5CF0; }
  .code-panel .fn { color: #FFC23B; }
  .code-panel .dim { color: #6E6389; }

  .creature-frame {
    position: absolute;
    top: 168px;
    right: 48px;
    width: 340px;
    height: 340px;
    border-radius: 28px;
    overflow: hidden;
    background: #0F0C1A;
    box-shadow: 0 24px 64px rgba(0,0,0,.4);
  }
  .creature-frame img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center 22%;
    display: block;
  }

  .headline {
    position: absolute;
    top: 560px;
    left: 48px;
    right: 48px;
    font-family: 'Onest', sans-serif;
    font-weight: 800;
    font-size: 68px;
    line-height: 1.04;
    letter-spacing: -.025em;
    color: #FBF6EC;
  }
  .headline .accent { color: #7B5CF0; }

  .subhead-pill {
    position: absolute;
    left: 48px;
    bottom: 208px;
    max-width: 560px;
    background: rgba(251,246,236,.94);
    color: #2A241B;
    font-family: 'DM Sans', sans-serif;
    font-weight: 400;
    font-size: 26px;
    line-height: 1.4;
    padding: 20px 26px;
    border-radius: 18px;
  }

  .cta-pill {
    position: absolute;
    right: 48px;
    bottom: 48px;
    display: flex;
    align-items: center;
    gap: 10px;
    background: #FFC23B;
    color: #2A241B;
    font-family: 'Onest', sans-serif;
    font-weight: 700;
    font-size: 27px;
    padding: 20px 30px;
    border-radius: 999px;
    box-shadow: 0 8px 24px rgba(0,0,0,.35);
  }
</style>
</head>
<body>
  <div class="ad-square" data-canvas-width="1080" data-canvas-height="1080">
    <div class="bg-photo"></div>
    <div class="bg-scrim"></div>

    <div class="brand-pill">
      <svg viewBox="0 0 32 32"><circle cx="16" cy="16" r="16" fill="#FFC23B"/><path d="M10 14c1-2 3-2 3.5 0" stroke="#2A241B" stroke-width="2" fill="none" stroke-linecap="round"/><path d="M18.5 14c1-2 3-2 3.5 0" stroke="#2A241B" stroke-width="2" fill="none" stroke-linecap="round"/><path d="M12 20c1.5 1.6 6.5 1.6 8 0" stroke="#2A241B" stroke-width="2" fill="none" stroke-linecap="round"/></svg>
      <span>yolkling</span>
    </div>

    <div class="code-panel">
      <span class="kw">struct</span> <span class="fn">YolkBody</span>: Shape {<br/>
      &nbsp;&nbsp;<span class="kw">func</span> <span class="fn">path</span>(in rect: CGRect) {<br/>
      &nbsp;&nbsp;&nbsp;&nbsp;<span class="dim">// no image assets. ever.</span><br/>
      &nbsp;&nbsp;&nbsp;&nbsp;p.<span class="fn">addCurve</span>(to: ...)<br/>
      &nbsp;&nbsp;}<br/>
      }
    </div>

    <div class="creature-frame">
      <img src="../../public/shots/vibe.png" alt="a yolkling forming from code, mid customization" />
    </div>

    <div class="headline">every line of this creature is written. <span class="accent">not drawn.</span></div>

    <div class="subhead-pill">no image assets. no AI art. just swiftui code and a lot of coffee.</div>

    <div class="cta-pill">
      see how it's built
      <svg width="20" height="20" viewBox="0 0 20 20" fill="none"><path d="M4 10h12M11 5l5 5-5 5" stroke="#2A241B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </div>
  </div>
</body>
</html>
