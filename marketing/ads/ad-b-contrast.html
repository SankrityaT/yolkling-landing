<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Yolkling ad — the contrast</title>
<meta name="hz:slide-selector" content=".ad-square" />
<meta name="hz:canvas-width" content="1080" />
<meta name="hz:canvas-height" content="1080" />
<style>
  @import url('https://fonts.googleapis.com/css2?family=Onest:wght@700;800;900&family=DM+Sans:wght@400;500;700&family=DM+Mono:wght@400;500&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { display: flex; justify-content: center; align-items: center; min-height: 100vh; background: #e9e2d3; }

  .ad-square {
    position: relative;
    width: 1080px;
    height: 1080px;
    overflow: hidden;
    background: linear-gradient(160deg, #3E6E5A 0%, #274A3C 55%, #1C362B 100%);
    font-family: 'DM Sans', sans-serif;
  }

  .bg-photo {
    position: absolute;
    inset: 0;
    background-image: url('./bg-contrast.jpg');
    background-size: cover;
    background-position: center;
  }

  .bg-scrim {
    position: absolute;
    inset: 0;
    background: linear-gradient(180deg, rgba(20,26,20,.15) 0%, rgba(20,26,20,.1) 40%, rgba(20,26,20,.78) 100%);
  }

  .brand-pill {
    position: absolute;
    top: 48px;
    left: 48px;
    display: flex;
    align-items: center;
    gap: 10px;
    background: rgba(251,246,236,.94);
    padding: 10px 22px 10px 12px;
    border-radius: 999px;
    box-shadow: 0 4px 16px rgba(0,0,0,.25);
  }
  .brand-pill svg { width: 34px; height: 34px; display: block; }
  .brand-pill span {
    font-family: 'Onest', sans-serif;
    font-weight: 800;
    font-size: 22px;
    letter-spacing: -.01em;
    color: #2A241B;
  }

  .headline {
    position: absolute;
    top: 220px;
    left: 48px;
    right: 48px;
    font-family: 'Onest', sans-serif;
    font-weight: 800;
    font-size: 76px;
    line-height: 1.02;
    letter-spacing: -.025em;
    color: #FBF6EC;
    text-shadow: 0 6px 30px rgba(0,0,0,.35);
  }
  .headline .accent { color: #8FD0FF; }

  .creature-frame {
    position: absolute;
    left: 50%;
    top: 470px;
    transform: translateX(-50%);
    width: 480px;
    height: 312px;
    border-radius: 28px;
    overflow: hidden;
    background: #FBF6EC;
    box-shadow: 0 24px 64px rgba(0,0,0,.3);
    border: 6px solid rgba(251,246,236,.9);
  }
  .creature-frame img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center 26%;
    display: block;
  }

  .subhead-pill {
    position: absolute;
    left: 48px;
    top: 878px;
    max-width: 560px;
    background: rgba(251,246,236,.94);
    color: #2A241B;
    font-family: 'DM Sans', sans-serif;
    font-weight: 400;
    font-size: 27px;
    line-height: 1.4;
    padding: 20px 26px;
    border-radius: 18px;
  }

  .cta-pill {
    position: absolute;
    right: 48px;
    bottom: 48px;
    display: flex;
    align-items: center;
    gap: 10px;
    background: #FFC23B;
    color: #2A241B;
    font-family: 'Onest', sans-serif;
    font-weight: 700;
    font-size: 27px;
    padding: 20px 30px;
    border-radius: 999px;
    box-shadow: 0 8px 24px rgba(0,0,0,.3);
  }
</style>
</head>
<body>
  <div class="ad-square" data-canvas-width="1080" data-canvas-height="1080">
    <div class="bg-photo"></div>
    <div class="bg-scrim"></div>

    <div class="brand-pill">
      <svg viewBox="0 0 32 32"><circle cx="16" cy="16" r="16" fill="#FFC23B"/><path d="M10 14c1-2 3-2 3.5 0" stroke="#2A241B" stroke-width="2" fill="none" stroke-linecap="round"/><path d="M18.5 14c1-2 3-2 3.5 0" stroke="#2A241B" stroke-width="2" fill="none" stroke-linecap="round"/><path d="M12 20c1.5 1.6 6.5 1.6 8 0" stroke="#2A241B" stroke-width="2" fill="none" stroke-linecap="round"/></svg>
      <span>yolkling</span>
    </div>

    <div class="headline">every app wants your attention.<br/>yours wants you <span class="accent">outside.</span></div>

    <div class="creature-frame">
      <img src="../../public/shots/visit.png" alt="a decorated yolkling in a friend's room" />
    </div>

    <div class="subhead-pill">yolkling gets sleepy when you doomscroll, and glows when you don't.</div>

    <div class="cta-pill">
      free on the App Store
      <svg width="20" height="20" viewBox="0 0 20 20" fill="none"><path d="M4 10h12M11 5l5 5-5 5" stroke="#2A241B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </div>
  </div>
</body>
</html>
